<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5EFE2">
<title>研究所考前讀書進度表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EFE2;--paper:#FFFAF0;--ink:#3E3A39;--coral:#E8B4A8;--yellow:#EFD9A0;--aqua:#BCD6E0;--lav:#D4C8E2;--peach:#F0C9A0;--green:#C9DCBA;--b:3px solid var(--ink);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 40px}
/* 固定選單 */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:var(--b);padding-top:env(safe-area-inset-top)}
.bar{max-width:520px;margin:0 auto;padding:8px 14px 10px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:7px}
.brand i{width:22px;height:22px;border:var(--b);border-radius:50%;background:var(--yellow);display:inline-block}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 4px;margin:-4px -2px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:var(--b);border-radius:999px;background:var(--paper);padding:5px 14px;font-size:15px;transition:transform .35s var(--spring),background .2s}
.tabs button.on{background:var(--coral);transform:translateY(-2px)}
.tabs button:active{transform:scale(.94)}
main.wrap{padding-top:8px}
/* 卡片 */
.card{border:var(--b);border-radius:28px;background:var(--paper);padding:16px;margin:0 0 16px}
.card.y{background:var(--yellow)}.card.a{background:var(--aqua)}.card.g{background:var(--green)}.card.c{background:var(--coral)}
h1{font-size:25px;line-height:1.3;margin:0}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:16px;margin:0}
.sub{font-size:13px;opacity:.8}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{justify-content:space-between}
.tag{display:inline-block;border:2.5px solid var(--ink);border-radius:999px;padding:0 10px;font-size:12.5px;line-height:21px;background:var(--paper);white-space:nowrap}
.t-coral{background:var(--coral)}.t-yellow{background:var(--yellow)}.t-aqua{background:var(--aqua)}.t-green{background:var(--green)}
.must{background:var(--coral);transform:rotate(-3deg);font-weight:700}
.bartrack{height:18px;border:var(--b);border-radius:999px;background:var(--paper);overflow:hidden}
.bartrack>div{height:100%;background:var(--green);border-right:var(--b);transition:width .5s var(--spring)}
.bartrack>div[style*="width:0%"]{border-right:0}
/* 首頁 */
.hero{padding:0;overflow:hidden;background:var(--aqua)}
.hero svg{display:block;width:100%;height:auto;max-height:230px}
.hero .txt{background:var(--paper);border-top:var(--b);padding:14px 16px 16px}
.cd{display:flex;gap:8px;margin-top:12px}
.cd div{flex:1;border:var(--b);border-radius:20px;background:var(--yellow);text-align:center;padding:6px 0 4px}
.cd div:nth-child(2){background:var(--green)}.cd div:nth-child(3){background:var(--coral)}
.cd b{display:block;font-size:28px;line-height:1.1;font-weight:400}
.cd span{font-size:12px}
/* 日期切換 */
.wk{display:flex;align-items:center;gap:8px}
.arrow{flex:0 0 40px;height:64px;border:var(--b);border-radius:20px;background:var(--paper);font-size:20px;transition:transform .3s var(--spring)}
.arrow:active{transform:scale(.9)}.arrow:disabled{opacity:.35}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:var(--b);border-radius:18px;background:var(--paper);padding:5px 0 4px;text-align:center;line-height:1.2;min-width:0;transition:transform .3s var(--spring),background .2s}
.day small{display:block;font-size:11px}.day b{font-weight:400;font-size:17px}
.day:disabled{opacity:.3;border-style:dashed;cursor:default}
.day.today{background:var(--aqua)}
.day.done{background:var(--green)}
.day.sel{background:var(--yellow);transform:translateY(-4px) scale(1.06);animation:bounce .55s var(--spring)}
.day:active:not(:disabled){transform:scale(.9)}
@keyframes bounce{0%{transform:translateY(4px) scale(.8)}55%{transform:translateY(-9px) scale(1.14)}100%{transform:translateY(-4px) scale(1.06)}}
/* 時間軸 */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:19px;top:18px;bottom:18px;width:3px;background:var(--ink);border-radius:2px}
.tl li{position:relative;display:flex;gap:10px;margin-bottom:12px}
.tl.in li{animation:rise .5s var(--spring) backwards;animation-delay:calc(var(--i)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
.dot{flex:0 0 40px;width:40px;height:40px;border:var(--b);border-radius:50%;background:var(--paper);font-size:19px;line-height:1;z-index:1;transition:transform .3s var(--spring),background .2s}
.dot:active{transform:scale(.85)} .tl li{min-height:62px} .tl li.life .it{background:var(--bg)!important;border-color:#D8C7A3!important;opacity:1!important} .tl li.life .dot{background:var(--bg)!important;border-color:#D8C7A3!important} .tl li.life .tag{background:var(--bg)!important;border-color:#D8C7A3!important} .tl li.gap .it{cursor:default} .tl li.life .dot{visibility:hidden!important} .hide-life .tl li.life{display:none!important} .lsw{align-items:center;margin-bottom:6px} .sw{position:relative;flex:0 0 52px;width:52px;height:30px;border:2px solid var(--ink);border-radius:999px;background:#E3DFD6;padding:0;cursor:pointer;transition:background .2s} .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);box-sizing:border-box;transition:transform .25s var(--spring)} .sw.on{background:#2E7BA8} .sw i{transform:translateX(22px)}.sw.on i{transform:translateX(0)} .tl li.life .tmn{top:10px} .tmn{position:absolute;left:-4px;top:42px;width:48px;text-align:center;font-size:11px;font-weight:900;line-height:17px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;z-index:2;pointer-events:none}
.tl li.ok .dot{background:var(--green)}
.tl li.fresh .dot{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}.tl li.fresh .dot span{display:inline-block;animation:chk .5s cubic-bezier(.2,1.4,.4,1)}.tl li.fresh .it{animation:flash .7s ease}
.chk.fresh i{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.it{flex:1;min-width:0;border:var(--b);border-radius:22px;background:var(--paper);padding:10px 12px;cursor:pointer;transition:opacity .2s}
.tl li.ok .it{opacity:.6}.tl li.ok .ttl{text-decoration:line-through}
.ttl{margin:5px 0 0;overflow-wrap:anywhere}
.note{font-size:13px;opacity:.75;overflow-wrap:anywhere}
.hr{font-size:13px;white-space:nowrap}
/* 其他 */
.list{margin:0;padding:0;list-style:none}
.list li{padding:6px 0;border-top:2px dashed var(--ink)}.list li:first-child{border-top:0}
.seg{display:flex;height:16px;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.seg i{display:block;border-right:2px solid var(--ink)}.seg i:last-child{border:0}
.lg{display:flex;flex-wrap:wrap;gap:6px}
a.btn{display:inline-block;border:var(--b);border-radius:999px;padding:3px 14px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--yellow);transition:transform .3s var(--spring)}
a.btn:active{transform:scale(.92)}a.btn.b2{background:var(--aqua)}
.chk{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:14px}
.chk i{width:24px;height:24px;border:var(--b);border-radius:8px;background:var(--paper);display:inline-block;text-align:center;line-height:18px;font-style:normal}
.chk.on i{background:var(--green)}
.nc{border:var(--b);border-radius:24px;padding:12px 14px;margin:0 0 14px;font-size:14.5px;overflow-wrap:anywhere;background:#ECE6D9}
button.nc{display:block;width:100%;text-align:left;background:#FBEDC6;color:#D9532B;font-size:15px;transition:transform .3s var(--spring)}button.nc:active{transform:scale(.97)}
.nc.c{background:#FBEDC6;color:#D9532B}.nc.a{background:#ECE6D9}.card.gr{background:#ECE6D9}.nc b{font-weight:400;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.stat{border:var(--b);border-radius:22px;padding:8px 12px;background:var(--paper)}.stat span{font-size:12px;opacity:.8}.stat b{display:block;font-size:23px;font-weight:400;line-height:1.2}
.tb{width:100%;border-collapse:collapse;font-size:14.5px}.tb td,.tb th{padding:5px 4px;border-bottom:2px dashed var(--ink);text-align:left;font-weight:400;vertical-align:top}.tb tr:last-child td{border:0}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:8px}.bars div{flex:1;text-align:center;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;border:2.5px solid var(--ink);border-radius:9px 9px 4px 4px;background:var(--aqua);margin:2px 3px}.bars .tdy i{background:var(--paper)}
.pane{display:none}.pane.on{display:block;animation:fadein .35s ease}
.pane.on.sl{animation:sl .38s cubic-bezier(.2,.8,.2,1)}.pane.on.sr{animation:sr .38s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cur{outline:3px dashed var(--ink);outline-offset:3px}
footer{text-align:center;font-size:12px;opacity:.6;padding:6px 0 20px}
/* 插圖動畫 */
.fl{animation:fl 3.2s ease-in-out infinite}
.bl{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
.cl1{animation:dr 7s ease-in-out infinite alternate}.cl2{animation:dr 9s ease-in-out infinite alternate-reverse}
.st{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.pc{transform-box:fill-box;transform-origin:bottom center;animation:wg 2.8s ease-in-out infinite}
.sun{transform-box:fill-box;transform-origin:center;animation:pu 3.4s ease-in-out infinite}
.roam{animation:roam 12s infinite}
.hp{transform-box:fill-box;transform-origin:center bottom;animation:hp 12s infinite}
.hd{transform-box:fill-box;transform-origin:50% 85%;animation:hd 12s infinite}
.qm{opacity:0;animation:qm 12s infinite}
.bf{animation:bfm 12s linear infinite}
.bb{animation:bob .7s ease-in-out infinite alternate}
.wl,.wr{transform-box:fill-box;animation:flap .22s ease-in-out infinite alternate}
.wl{transform-origin:right center}.wr{transform-origin:left center}
.tl2{transform-box:fill-box;transform-origin:right bottom;animation:wag .9s ease-in-out infinite alternate}
@keyframes fl{50%{transform:translateY(-5px)}}
@keyframes roam{
0%,5%{transform:translateX(-80px) scaleX(1)}12%,15%{transform:translateX(-40px) scaleX(1)}22%,25%{transform:translateX(0) scaleX(1)}32%,40%{transform:translateX(40px) scaleX(1)}48%,60%{transform:translateX(90px) scaleX(1)}
60.01%,66%{transform:translateX(90px) scaleX(-1)}73%,76%{transform:translateX(33px) scaleX(-1)}83%,86%{transform:translateX(-24px) scaleX(-1)}93%{transform:translateX(-80px) scaleX(-1)}99.99%{transform:translateX(-80px) scaleX(-1)}100%{transform:translateX(-80px) scaleX(1)}}
@keyframes hp{
0%,5%,12%,15%,22%,25%,32%{transform:none}8.5%,18.5%,28.5%{transform:translateY(-22px)}
35%{transform:none}36.5%,38.5%{transform:scale(1.07,.88) rotate(-2deg)}37.5%{transform:scale(1.07,.88) rotate(2deg)}40%{transform:scale(1.1,.84)}44%{transform:translateY(-46px) scale(.95,1.08)}48%{transform:scale(1.1,.84)}50%,66%{transform:none}
69.5%,79.5%,89.5%{transform:translateY(-22px)}73%,76%,83%,86%,93%,100%{transform:none}}
@keyframes hd{0%,49%{transform:none}52%,56%{transform:rotate(-18deg)}58%{transform:rotate(8deg)}61%,100%{transform:none}}
@keyframes qm{0%,50%{opacity:0;transform:translateY(4px)}52%,57%{opacity:1;transform:none}59%,100%{opacity:0;transform:translateY(-4px)}}
@keyframes bfm{
0%{transform:translate(150px,115px);opacity:0}3%{opacity:1}12%{transform:translate(172px,100px)}22%{transform:translate(212px,112px)}32%{transform:translate(252px,98px)}40%{transform:translate(278px,118px)}44%{transform:translate(284px,126px)}48%{transform:translate(312px,62px)}52%{transform:translate(335px,40px)}60%{transform:translate(300px,34px)}66%{transform:translate(240px,56px)}76%{transform:translate(180px,80px)}86%{transform:translate(122px,94px)}94%{opacity:1}100%{transform:translate(60px,106px);opacity:0}}
@keyframes bob{from{transform:translateY(-4px) rotate(-10deg)}to{transform:translateY(4px) rotate(10deg)}}
@keyframes flap{to{transform:scaleX(.25)}}
@media (prefers-reduced-motion:reduce){.roam,.hp,.hd,.qm,.bf,.bb,.wl,.wr{animation:none}.bf{transform:translate(250px,100px)}.roam{transform:translateX(40px)}}
@keyframes wag{to{transform:rotate(12deg)}}
@keyframes pu{50%{transform:scale(1.1)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes dr{to{transform:translateX(18px)}}
@keyframes tw{50%{transform:scale(.55) rotate(20deg);opacity:.6}}
@keyframes wg{50%{transform:rotate(5deg)}}
/* 按鈕與進場動畫 */
.tabs button,a.btn{box-shadow:0 3px 0 var(--ink)}
.tabs button.on{box-shadow:0 5px 0 var(--ink)}
.tabs button,.arrow,.day,.dot,.nc,.it,a.btn,.chk,.stat,.tag[id]{transition:transform .34s var(--spring),box-shadow .2s,background .2s,opacity .2s;touch-action:manipulation}
.tabs button:active,.arrow:active:not(:disabled),.day:active:not(:disabled),a.btn:active,.chk:active i{transform:translateY(3px) scale(.96);box-shadow:0 0 0 var(--ink)}
.dot:active,.it:active,.stat:active{transform:scale(.95)}
@media (hover:hover){.tabs button:hover,.arrow:hover:not(:disabled),.day:hover:not(:disabled),a.btn:hover,.it:hover,.nc:hover,.stat:hover{transform:translateY(-2px)}}
.in2{animation:rise .55s var(--spring) backwards;animation-delay:calc(var(--i,0)*45ms)}
.sl.w{animation:sl .4s cubic-bezier(.2,.8,.2,1)}.sr.w{animation:sr .4s cubic-bezier(.2,.8,.2,1)}
.bartrack>div{transform-origin:left center;animation:grow .55s cubic-bezier(.2,.8,.2,1) backwards}
.seg i{transform-origin:left center;animation:grow .6s cubic-bezier(.2,.8,.2,1) backwards}
.bars i{transform-origin:bottom center;animation:up .55s var(--spring) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes up{from{transform:scaleY(0)}}
@keyframes chk{from{transform:scale(.3) rotate(-30deg);opacity:0}}
@keyframes flash{0%{background:var(--green)}100%{background:var(--paper)}}
/* 精簡層級：彩色只留重點 */
.tag{border-width:2px}.t-gray{background:#ECE6D9}
.card.y,.card.a,.card.g,.card.c{background:var(--paper)}
.sj{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;white-space:nowrap}
.sj i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.sj .d-coral{background:var(--coral)}.sj .d-yellow{background:var(--yellow)}.sj .d-aqua{background:var(--aqua)}.sj .d-green{background:var(--green)}
.it,.stat,.day,.arrow,.nc{border-width:2px}.dot{border-width:2.5px}.seg,.bars i{border-width:2px}
.day.sel{background:var(--coral)}.day.today{background:#ECE6D9}
.cd div:nth-child(n+2){background:var(--paper)}.cd div:first-child{background:var(--coral)}
.nc.imp{background:#FBEDC6;color:#D9532B;border-width:3px;padding:10px 14px}
button.bn{display:block;width:100%;text-align:left;font-size:15px;cursor:pointer}
.il{display:block;width:100%;text-align:left;background:none;border:0;border-top:2px dashed #D9532B;margin:8px 0 0;padding:8px 0 0;color:inherit;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer}
div.il{cursor:default}
details.nc summary{cursor:pointer;list-style:none;font-size:16px}details.nc summary::-webkit-details-marker{display:none}
details.nc summary::after{content:' ＋';opacity:.6}details.nc[open] summary::after{content:' －'}details.nc[open] summary{margin-bottom:6px}
/* 第一眼層級：今日卡 > 任務 > 統計 */
#p-today .card.y{background:var(--coral)}
#p-today .card.y h2{font-size:25px}
#p-today .card.y .bartrack{background:var(--paper)}#p-today .card.y .bartrack>div{background:#2E7BA8} /* 同日常行程開關 .sw.on */
.stat{background:#ECE6D9;border-width:2px}.stat b{font-size:20px}.stat span{opacity:.7}
.it{border-width:3px}.dot{border-width:3px}
.tl li.ok .it{background:#ECE6D9}
/* 今日任務卡：未完成=暖黃，點擊後=灰 */
.tl li .it{background:var(--aqua)}
.tl li.ok .it{background:#E3DFD6;opacity:.75}
.tl li.ok .dot{background:#CFCBC2}
#p-today .card.y.dn{background:#E3DFD6}
@keyframes flash{0%{background:var(--aqua)}100%{background:#E3DFD6}}
/* 天數：放大、桔紅 */
.big{color:#D9532B;white-space:nowrap}.big b{font-size:34px;font-weight:400;line-height:1;margin:0 4px}.big small{font-size:13px}
.stat b.og{color:#D9532B;font-size:30px}
.cd div:first-child{background:var(--paper)}.cd div:first-child b{color:#D9532B;font-size:36px}
/* 各科進度：大標題色帶＋大字 */
.sj .d-lav{background:var(--lav)}.sj .d-peach{background:var(--peach)}
.card.sc{padding:0;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:var(--b)}
.sn{font-size:26px;line-height:1.2}.sp2{font-size:15px}
.sb{padding:14px 16px 16px}.sb .bartrack{height:20px}
.kv{margin-top:14px}.kv span{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 12px;font-size:14px;line-height:22px;background:#ECE6D9}
.kv p{margin:6px 0 0;font-size:17px;line-height:1.65;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.day.sel,.tabs button.on{transform:none}}

/* ===== v2：簡化層級（字級只留 5 階：13 / 15 / 17 / 22 / 28；顏色只留重點） ===== */
body{font-size:16px;line-height:1.65}
h1,h2,h3,.brand,.sn{font-weight:900}
h1{font-size:28px}h2{font-size:22px;margin-bottom:6px}h3{font-size:17px}
.brand{font-size:16px}
.sub,.note,.hr,.tag,.cd span,.stat span,.sp2{font-size:13px;opacity:1;color:#655D59}
.sub{font-size:14px}
.tag{font-weight:700;color:var(--ink);padding:1px 10px}
/* 卡片：統一白底，只有最上面的「今日」卡與考試倒數保留顏色 */
.card{box-shadow:4px 4px 0 var(--ink);background:#fff}
.card.a,.card.g,.card.gr{background:#fff}
.nc{box-shadow:none}
/* 分頁列 */
.tabs button{font-size:15px;font-weight:900;padding:6px 15px}
/* 今日任務：白底卡片＋粗體標題＋灰色說明 */
.tl li .it{background:#fff;border-width:2.5px;padding:12px 14px}
.tl li.ok .it{background:#ECF7E5;opacity:.8}
.tl li .ttl{font-size:17px;font-weight:900;line-height:1.55;margin:8px 0 0}
.tl li .note{font-size:14px;color:#655D59;margin-top:4px}
.tl li .hr{font-size:14px;font-weight:900;color:var(--ink)}
.tl li .dot{background:#fff}
.tl li.c-L .dot{background:var(--aqua)}.tl li.c-Q .dot{background:var(--yellow)}
.tl li.c-P .dot,.tl li.c-M .dot{background:var(--coral)}.tl li.c-R .dot{background:var(--green)}.tl li.c-Z .dot{background:#E3DFD6}
.tl li.ok .dot{background:#CFCBC2}
.tl li.ok .ttl{text-decoration-thickness:2px}
.must{transform:none;font-weight:900;background:var(--coral)}
.sj{font-size:14px;font-weight:700}
/* 提醒：標題橘色粗體，內文改回深色，比較好讀 */
